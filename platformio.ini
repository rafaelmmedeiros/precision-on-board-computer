; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -Wall -Wextra -Wno-unused-variable -Wno-unused-function -Wno-unused-but-set-variable -Wno-sign-compare -Wno-write-strings
; The Arduino framework appends its own -std=gnu++11, which wins on the command
; line and demotes every `if constexpr` in Telemetry/GpsModule to a warned GCC
; extension. Dropping it is what actually makes the C++17 in §3.2 real.
build_unflags = -std=gnu++11
lib_deps = mikalhart/TinyGPSPlus@1.1.0

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = pobc.local
